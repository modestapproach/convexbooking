name: Deploy web app to Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-booking-app
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BOOKING_PUBLIC_URL: ${{ vars.BOOKING_PUBLIC_URL }}
      BOOKING_WORKER_NAME: ${{ vars.BOOKING_WORKER_NAME }}
      BOOKING_APP_NAME: ${{ vars.BOOKING_APP_NAME }}
      BOOKING_CONVEX_URL: ${{ vars.BOOKING_CONVEX_URL }}
      BOOKING_OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
      BOOKING_OWNER_NAME: ${{ secrets.OWNER_NAME }}
      BOOKING_OWNER_USERNAME: ${{ secrets.OWNER_USERNAME }}
      BOOKING_ACCESS_TEAM_DOMAIN: ${{ vars.BOOKING_ACCESS_TEAM_DOMAIN }}
      BOOKING_ACCESS_AUD: ${{ vars.BOOKING_ACCESS_AUD }}
      BOOKING_ACCESS_ALLOWED_EMAILS: ${{ vars.BOOKING_ACCESS_ALLOWED_EMAILS }}
    steps:
      - uses: actions/checkout@v4

      - name: Check configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          CALENDSO_ENCRYPTION_KEY: ${{ secrets.CALENDSO_ENCRYPTION_KEY }}
        run: |
          missing=()
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID NEXTAUTH_SECRET \
            CALENDSO_ENCRYPTION_KEY BOOKING_PUBLIC_URL BOOKING_WORKER_NAME \
            BOOKING_APP_NAME BOOKING_CONVEX_URL BOOKING_OWNER_EMAIL \
            BOOKING_OWNER_NAME BOOKING_OWNER_USERNAME BOOKING_ACCESS_TEAM_DOMAIN \
            BOOKING_ACCESS_AUD BOOKING_ACCESS_ALLOWED_EMAILS; do
            [ -n "${!key}" ] || missing+=("$key")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing GitHub Secrets/Variables: ${missing[*]}"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate self-host configuration
        run: node scripts/configure.mjs --non-interactive

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force

      - name: Enable Yarn 4
        run: corepack enable && corepack prepare yarn@4.12.0 --activate

      - name: Install web workspace
        working-directory: app
        env:
          HUSKY: "0"
        run: yarn install --mode=skip-build

      - name: Deploy Worker and Container
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: app
          wranglerVersion: "4.97.0"
          command: deploy --config wrangler.jsonc
          secrets: |
            NEXTAUTH_SECRET
            CALENDSO_ENCRYPTION_KEY
            OWNER_EMAIL
            OWNER_NAME
            OWNER_USERNAME
        env:
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          CALENDSO_ENCRYPTION_KEY: ${{ secrets.CALENDSO_ENCRYPTION_KEY }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          OWNER_NAME: ${{ secrets.OWNER_NAME }}
          OWNER_USERNAME: ${{ secrets.OWNER_USERNAME }}

      - name: Smoke test
        run: |
          for attempt in $(seq 1 16); do
            code=$(curl -sS -o /dev/null -w "%{http_code}" "$BOOKING_PUBLIC_URL/" || true)
            echo "attempt $attempt: $code"
            case "$code" in 200|302|307) exit 0 ;; esac
            sleep 15
          done
          echo "::error::Deployment did not answer within four minutes"
          exit 1
