name: Build fallback image (GHCR)

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BOOKING_PUBLIC_URL: ${{ vars.BOOKING_PUBLIC_URL }}
      BOOKING_WORKER_NAME: ${{ vars.BOOKING_WORKER_NAME }}
      BOOKING_APP_NAME: ${{ vars.BOOKING_APP_NAME }}
      BOOKING_CONVEX_URL: ${{ vars.BOOKING_CONVEX_URL }}
      BOOKING_OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
      BOOKING_OWNER_NAME: ${{ secrets.OWNER_NAME }}
      BOOKING_OWNER_USERNAME: ${{ secrets.OWNER_USERNAME }}
      BOOKING_ACCESS_TEAM_DOMAIN: ${{ vars.BOOKING_ACCESS_TEAM_DOMAIN }}
      BOOKING_ACCESS_AUD: ${{ vars.BOOKING_ACCESS_AUD }}
      BOOKING_ACCESS_ALLOWED_EMAILS: ${{ vars.BOOKING_ACCESS_ALLOWED_EMAILS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate build configuration
        run: node scripts/configure.mjs --non-interactive
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
